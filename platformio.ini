[platformio]
src_dir = platform
default_envs = esp32_rx


; ============================================================
; ESP32 受信側
; ============================================================
[env:esp32_rx]

; ------------------------------------------------------------
; Platform / Board
; ------------------------------------------------------------
platform = espressif32
board = esp32dev
framework = arduino


; ------------------------------------------------------------
; Include Paths
; ------------------------------------------------------------
build_flags =
    -I platform


; ------------------------------------------------------------
; Dependencies
; ------------------------------------------------------------
lib_deps =
    adafruit/Adafruit_VL53L0X
    adafruit/Adafruit NeoPixel


; ------------------------------------------------------------
; Serial Monitor
; ------------------------------------------------------------
monitor_speed = 115200
monitor_eol = LF
monitor_echo = yes

monitor_filters =
    time
    colorize
    esp32_exception_decoder
    send_on_enter


; ------------------------------------------------------------
; Upload
; ------------------------------------------------------------
upload_speed = 921600


; ------------------------------------------------------------
; Compiler
; 自作ソースにだけ適用する
; ------------------------------------------------------------
build_src_flags =
    -std=gnu++17
    -Wall
    -Wextra


; ------------------------------------------------------------
; Static Analysis
; ------------------------------------------------------------
check_tool = cppcheck
check_skip_packages = yes

check_flags =
    cppcheck: --std=c++17
    cppcheck: --enable=warning,style,performance,portability
    cppcheck: --suppress=missingIncludeSystem
